[build]
  publish = "."

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://projetoweb-zxe9.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/bible-api/*"
  to = "https://bible-api.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://accounts.google.com; frame-src https://www.bibliaonline.com.br https://www.youtube.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://projetoweb-zxe9.onrender.com https://bible-api.com;"

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
