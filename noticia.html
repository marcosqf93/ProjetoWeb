<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notícia | PODBEN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237a2cff'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Poppins,Arial' font-weight='800' font-size='48' fill='white'%3EP%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="page-loader"><div class="page-loader-spinner"></div></div>
  <header class="topbar">
    <a class="logo" href="index.html"><img class="logo-img" src="https://i.ibb.co/yFXZ4Lhb/channels4-profile.jpg" alt="Logo PODBEN" onerror="this.style.display='none'"/><span class="logo-text"><strong class="logo-title">PODBEN</strong><span class="logo-subtitle">Notícia</span></span></a>
    <button id="menu-toggle">☰ Menu</button>
    <nav id="menu"><a href="index.html">Início</a><a href="noticias.html">Notícias</a><a href="estudos.html">Estudos Bíblicos</a><a href="colunistas.html">Colunistas</a><a href="galeria.html">Galeria</a><a href="quem-somos.html">Quem Somos</a></nav>
  </header>

  <main class="container single-news-page">
    <article id="single-news" class="card news-article-shell">
      <div class="news-loading"><div class="skeleton-card"><div class="skeleton skeleton-p-short"></div><div class="skeleton skeleton-h2"></div><div class="skeleton skeleton-p" style="width:80%"></div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-p"></div><div class="skeleton skeleton-p"></div><div class="skeleton skeleton-p" style="width:60%"></div></div></div>
    </article>

    <section class="news-support-layout">
      <section class="card news-related-block">
        <div class="section-head">
          <h2>Notícias relacionadas</h2>
          <a href="noticias.html">Ver mais notícias</a>
        </div>
        <div id="news-related-list" class="grid"></div>
      </section>
      <aside class="card news-latest-block">
        <h3>Últimas notícias</h3>
        <div id="single-news-latest" class="stack"></div>
      </aside>
    </section>

    <section class="card news-comments-block">
      <h2>Comentar na publicação</h2>
      <form id="news-comment-form" class="stack">
        <input name="nome" placeholder="Nome" required/>
        <textarea name="texto" rows="4" placeholder="Seu comentário" required></textarea>
        <button type="submit">Comentar</button>
      </form>
      <div id="news-comments" class="stack"></div>
    </section>
  </main>

  <footer id="site-footer" class="footer"></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
