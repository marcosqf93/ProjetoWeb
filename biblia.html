<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bíblia Digital | PODBEN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237a2cff'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Poppins,Arial' font-weight='800' font-size='48' fill='white'%3EP%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="biblia.css"/>
</head>
<body>
  <div class="page-loader"><div class="page-loader-spinner"></div></div>
  <header class="topbar">
    <a class="logo" href="index.html"><img class="logo-img" src="https://i.ibb.co/yFXZ4Lhb/channels4-profile.jpg" alt="Logo PODBEN" onerror="this.style.display='none'"/><span class="logo-text"><strong class="logo-title">PODBEN</strong><span class="logo-subtitle">Podcast & Vídeo Cristão</span></span></a>
    <button id="menu-toggle">☰ Menu</button>
    <nav id="menu"><a href="index.html">Início</a><a href="noticias.html">Notícias</a><a href="estudos.html">Estudos Bíblicos</a><a href="colunistas.html">Colunistas</a><a href="galeria.html">Galeria</a><a href="quem-somos.html">Quem Somos</a></nav>
  </header>

  <main class="container biblia-page">
    <section class="biblia-hero">
      <h1>Bíblia Sagrada</h1>
      <p class="meta">Almeida Corrigida Fiel (ACF) — Leia qualquer livro e capítulo online.</p>
    </section>

    <section id="biblia-books" class="biblia-books-section">
      <div class="biblia-card">
        <h2>Antigo Testamento</h2>
        <div id="old-testament" class="biblia-book-grid"></div>
      </div>
      <div class="biblia-card">
        <h2>Novo Testamento</h2>
        <div id="new-testament" class="biblia-book-grid"></div>
      </div>
    </section>

    <section id="biblia-chapters" class="biblia-chapters-section hidden">
      <div class="biblia-chapters-header">
        <button id="back-to-books" class="btn-outline">← Voltar aos livros</button>
        <h2 id="chapter-book-name"></h2>
      </div>
      <div id="chapter-list" class="biblia-chapter-grid"></div>
    </section>

    <section id="biblia-reader" class="biblia-reader-section hidden">
      <div class="biblia-reader-header">
        <button id="back-to-chapters" class="btn-outline">← Voltar aos capítulos</button>
        <div class="biblia-reader-nav">
          <button id="prev-chapter-btn" class="btn-outline" disabled>◀ Anterior</button>
          <span id="reader-title" class="meta"></span>
          <button id="next-chapter-btn" class="btn-outline" disabled>Próximo ▶</button>
        </div>
      </div>
      <div id="reader-content" class="biblia-reader-content"></div>
    </section>
  </main>

  <footer id="site-footer" class="footer"></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="biblia.js"></script>
</body>
</html>
